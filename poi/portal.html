    :root { --radius: 1rem; }
    html, body, #root { height: 100%; }
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;

      color: #f8fafc;
      margin: 0;
      overflow: hidden;
    }
    .font-serif { font-family: 'Source Serif 4', serif; }
    @keyframes silkyEnter {
      0% { opacity: 0; transform: translateY(15px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes radarSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-silky { animation: silkyEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .liquid-glass {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: ''; position: absolute; inset: 0; padding: 1.4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, transparent 40%, transparent 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none; border-radius: inherit;
    }
    .liquid-glass-strong {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: ''; position: absolute; inset: 0; padding: 1.4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.2) 20%, transparent 40%, transparent 60%, rgba(255,255,255,0.2) 80%, rgba(255,255,255,0.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none; border-radius: inherit;
    }
    .glass-content { position: relative; z-index: 10; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .radar-sweep {
      background: conic-gradient(from 0deg, transparent 70%, rgba(56, 189, 248, 0.4) 100%);
      animation: radarSpin 4s linear infinite;
      border-radius: 50%;
    }
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 30px transparent inset !important;
      -webkit-text-fill-color: white !important;
      transition: background-color 5000s ease-in-out 0s;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .rounded-inherit { border-radius: inherit; }
    @media (max-width: 1023px) {
      body { overflow: hidden; }
      .mobile-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
      .mobile-panel-height { min-height: calc(100dvh - 7.5rem); }
      .mobile-app-frame { padding: 0.75rem 0.75rem 0; }
      .mobile-main-safe {
        padding-top: max(0.35rem, env(safe-area-inset-top));
        padding-bottom: calc(6.75rem + env(safe-area-inset-bottom));
      }
      .mobile-bottom-nav { bottom: max(1rem, env(safe-area-inset-bottom)); }
      .mobile-shell-flat {
        background: transparent !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      .mobile-shell-flat::before { display: none !important; }
      .mobile-settings-shell {
        padding: 0.25rem 0.25rem 0 !important;
        align-items: stretch !important;
      }
      .mobile-settings-shell > .glass-content {
        max-width: none !important;
        margin-top: 0.25rem !important;
      }
      .collect-mobile-shell {
        padding-bottom: calc(8rem + env(safe-area-inset-bottom));
        scroll-padding-bottom: calc(8rem + env(safe-area-inset-bottom));
      }
      .collect-camera-panel {
        height: 31dvh;
        min-height: 250px;
        max-height: 340px;
      }
      .collect-form-panel { min-height: auto; }
      .map-mobile-shell {
        padding-top: 0.25rem;
        padding-bottom: calc(8rem + env(safe-area-inset-bottom));
        scroll-padding-bottom: calc(8rem + env(safe-area-inset-bottom));
      }
      .map-list-panel {
        min-height: 0;
        margin-top: 0.75rem;
        background: transparent !important;
        box-shadow: none !important;
        border-top: 0 !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        overflow: visible !important;
      }
      .map-list-panel::before { display: none !important; }
      .map-list-panel > .glass-content { overflow: visible !important; }
      .map-list-scroll {
        overflow: visible !important;
        padding-bottom: calc(8rem + env(safe-area-inset-bottom));
      }
      .map-detail-scroll { padding-bottom: calc(7.5rem + env(safe-area-inset-bottom)); }
      .map-detail-actions { padding-bottom: calc(6.75rem + env(safe-area-inset-bottom)); }
      .auth-scroll {
        height: 100dvh;
        min-height: 100dvh;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        align-items: flex-start;
        justify-content: flex-start;
        padding-top: max(1rem, env(safe-area-inset-top));
        padding-bottom: max(2rem, env(safe-area-inset-bottom));
      }
    }
    @media (max-width: 420px) {
      .mobile-tight-title { font-size: 2rem; line-height: 1.05; }
      .mobile-card-pad { padding: 1.25rem; }
    }

    const LanguageContext = createContext(null);

    function toLucideKey(name) {
      return name.replace(/(^\w|[-_]\w)/g, part => part.replace(/[-_]/, '').toUpperCase());
    }

    function Icon({ name, className = '' }) {
      const iconNode = window.lucide?.icons?.[toLucideKey(name)];
      if (!iconNode) return <span className={className}></span>;
      const renderNode = ([tag, attrs, children], index) => {
        const props = {};
        Object.entries(attrs || {}).forEach(([key, value]) => {
          props[key.replace(/-([a-z])/g, (_, char) => char.toUpperCase())] = value;
        });
        return React.createElement(tag, { ...props, key: index }, (children || []).map(renderNode));
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
          className={`lucide ${className}`} aria-hidden="true">
          {iconNode.map(renderNode)}
        </svg>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { console.error('[ErrorBoundary]', error, info); }
      render() {
        if (!this.state.error) return this.props.children;
        return (
          <div className="min-h-screen bg-slate-950 text-white p-6 flex items-center justify-center">
            <div className="max-w-lg liquid-glass-strong rounded-3xl p-6">
              <div className="glass-content">
                <h2 className="text-xl font-semibold mb-3">页面渲染出错</h2>
                <pre className="whitespace-pre-wrap text-xs text-white/70">{String(this.state.error?.stack || this.state.error?.message || this.state.error)}</pre>
                <button onClick={() => location.reload()} className="mt-5 liquid-glass px-5 py-3 rounded-2xl text-sm">Reload</button>
              </div>
            </div>
          </div>
        );
      }
    }

    function normalizeStatus(status) {
      if (status === 'approved') return 'verified';
      if (status === 'rejected') return 'error';
      return status || 'pending';
    }
    function normalizePoi(raw, fallbackStatus = 'pending') {
      const location = raw.location || {};
      const lng = Number(location.lng ?? raw.lng ?? 0);
      const lat = Number(location.lat ?? raw.lat ?? 0);
      return {
        id: raw._id || raw.id || String(Date.now()),
        rawId: raw._id || raw.id || '',
        name: raw.poiName || raw.name || '',
        category: raw.category || '',
        status: normalizeStatus(raw.status || fallbackStatus),
        lat: Number.isFinite(lat) ? lat : 0,
        lng: Number.isFinite(lng) ? lng : 0,
        address: raw.address || (Number.isFinite(lat) && Number.isFinite(lng) ? `${lat.toFixed(6)}, ${lng.toFixed(6)}` : ''),
        desc: raw.description ?? raw.desc ?? '',
        errorMsg: raw.rejectReason || raw.errorMsg || '',
        imageUrl: raw.imageUrl || '',
        createTime: raw.createTime || ''
      };
    }
    function mergePoiLists(...lists) {
      const map = new Map();
      lists.flat().filter(Boolean).forEach(poi => {
        const key = poi.rawId || poi.id;
        if (!key) return;
        const existing = map.get(key);
        if (!existing || existing.status === 'verified' || poi.status !== 'verified') {
          map.set(key, poi);
        }
      });
      return Array.from(map.values()).sort((a, b) => new Date(b.createTime || 0) - new Date(a.createTime || 0));
    }
    function splitDescriptionAndCategory(description, fallbackCategory = '') {
      const lines = String(description || '').split(/\r?\n/);
      let manualCategory = '';
      const descLines = [];
      lines.forEach(line => {
        const match = line.match(/^人工分类[:：]\s*(.+)$/);
        if (match) manualCategory = match[1].trim();
        else descLines.push(line);
      });
      return { desc: descLines.join('\n').trim(), category: manualCategory || fallbackCategory || '' };
    }
    function formatDisplayTime(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString('zh-CN', { hour12: false });
    }
    function isValidCoordinate(lat, lng) {
      return Number.isFinite(lat) && Number.isFinite(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180 && !(lat === 0 && lng === 0);
    }
    function getBrowserLocation(t) {
      return new Promise((resolve, reject) => {
        const isLocalHost = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
        if (window.location.protocol !== 'https:' && !isLocalHost) return reject(new Error(t('gpsRequiresHttps')));
        if (!navigator.geolocation) return reject(new Error(t('geoUnsupported')));
        navigator.geolocation.getCurrentPosition(
          pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: Math.round(pos.coords.accuracy || 0) }),
          reject,
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }
    function getLocationErrorMessage(err, t) {
      if (!err) return t('gpsFailed');
      if (err.code === 1) return t('locationDenied');
      if (err.code === 2) return t('locationUnavailable');
      if (err.code === 3) return t('locationTimeout');
      return err.message || t('gpsFailed');
    }
    function getDistanceMeters(a, b) {
      if (!a || !b || !isValidCoordinate(a.lat, a.lng) || !isValidCoordinate(b.lat, b.lng)) return null;
      const toRad = value => value * Math.PI / 180;
      const radius = 6371000;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const lat1 = toRad(a.lat);
      const lat2 = toRad(b.lat);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
      return 2 * radius * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
    }
    function formatDistance(meters) {
      if (!Number.isFinite(meters)) return '';
      return meters >= 1000 ? `${(meters / 1000).toFixed(meters >= 10000 ? 0 : 1)} km` : `${Math.round(meters)} m`;
    }
    function buildAmapRouteUrl(poi, mode = 'walking', origin = null) {
      if (!poi || !isValidCoordinate(poi.lat, poi.lng)) return '';
      const routeMode = mode === 'driving' ? 'car' : mode === 'transit' ? 'bus' : 'walk';
      const placeName = String(poi.name || poi.address || 'POI').replace(/,/g, ' ');
      const params = new URLSearchParams({
        to: `${poi.lng},${poi.lat},${placeName}`,
        mode: routeMode,
        policy: '0',
        src: 'check_collect',
        callnative: '1'
      });
      if (origin && isValidCoordinate(origin.lat, origin.lng)) {
        params.set('from', `${origin.lng},${origin.lat},我的位置`);
      }
      return `https://uri.amap.com/navigation?${params.toString()}`;
    }
    function openAmapRoute(poi, mode, origin, t) {
      const url = buildAmapRouteUrl(poi, mode, origin);
      if (!url) {
        alert(t('routeCoordinateMissing'));
        return;
      }
      window.open(url, '_blank', 'noopener,noreferrer');
    }
    let amapLoaderPromise = null;
    async function loadAmapSdk() {
      if (window.AMap) return window.AMap;
      if (amapLoaderPromise) return amapLoaderPromise;
      amapLoaderPromise = (async () => {
        const config = await fetchJson('/api/client-config?_t=' + Date.now());
        const key = config?.amap?.key;
        if (!key) throw new Error('AMap key missing');
        window._AMapSecurityConfig = {
          serviceHost: `${window.location.origin}/_AMapService`
        };
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = `https://webapi.amap.com/maps?v=2.0&key=${encodeURIComponent(key)}`;
          script.async = true;
          script.onload = resolve;
          script.onerror = () => reject(new Error('AMap SDK load failed'));
          document.head.appendChild(script);
        });
        return window.AMap;
      })();
      return amapLoaderPromise;
    }
    async function fetchJson(url, options = {}) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === false) {
        const error = new Error(data.message || `Request failed: ${res.status}`);
        error.status = res.status;
        throw error;
      }
      return data;
    }
    function revokePreview(url) {
      if (url && url.startsWith('blob:')) {

    }
    function compressImage(imageFile) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Image read failed'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Image format not recognized'));
          img.onload = () => {
            const maxSide = 1200;
            let width = img.width;
            let height = img.height;
            if (width > height && width > maxSide) {
              height = Math.round(height * maxSide / width);
              width = maxSide;
            } else if (height > maxSide) {
              width = Math.round(width * maxSide / height);
              height = maxSide;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Image compression failed')), 'image/jpeg', 0.82);
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(imageFile);
      });
    }

      }), [lang, t]);

      useEffect(() => {
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      }, [lang]);

      const restoreSession = useCallback(async () => {
        clearLegacyIdentityStorage();
        try {
          const response = await fetch('/api/auth/session?_t=' + Date.now(), { cache: 'no-store' });
          const payload = await response.json().catch(() => ({}));
          if (response.status === 401) {
            setOpenId('');
            setSessionStatus('anonymous');
            setAppState('landing');
            return false;
          }
          if (!response.ok || payload.success === false || !payload.data?.openId) {
            throw new Error(payload.message || `Request failed: ${response.status}`);
          }
          const restoredOpenId = String(payload.data.openId);
          const preferredRole = initial.role;
          const preferredRoleMatches = preferredRole
            && apiRole(preferredRole) === payload.data.role;
          setOpenId(restoredOpenId);
          setSessionStatus('authenticated');
          if (preferredRoleMatches) {
            setRole(preferredRole);
            setAppState('main');
          } else {
            setRole(null);
            setAppState('landing');
          }
          return true;
        } catch (_error) {
          setOpenId('');
          setSessionStatus('unavailable');
          setAppState('landing');
          return false;
        }
      }, [initial.role]);

      useEffect(() => { void restoreSession(); }, [restoreSession]);

      useEffect(() => {
        if (!openId || !role) return;
        const boundRole = apiRole(role);
        const bindKey = `${openId}:${boundRole}`;
        if (roleBindKeyRef.current === bindKey) return;
        roleBindKeyRef.current = bindKey;
        fetchJson('/api/user/bind-role', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role: boundRole })
        }).catch(err => {
          roleBindKeyRef.current = '';
          console.warn('[bind-role:init]', err);
        });
      }, [openId, role]);

      async function handleLogin(selectedRole) {
        if (!openId) {
          alert(t('wechatAuthRequired'));
          return;
        }
        await fetchJson('/api/user/bind-role', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role: apiRole(selectedRole) })
        });
        localStorage.setItem('userRole', selectedRole);
        setRole(selectedRole);
        setAppState('main');
      }
      async function handleLogout() {
        let serverLogoutConfirmed = false;
        try {
          const response = await fetch('/api/auth/logout', {
            method: 'POST',
            cache: 'no-store',
            headers: { Accept: 'application/json' }
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.success !== true) {
            throw new Error(`Logout request failed: ${response.status}`);
          }
          serverLogoutConfirmed = true;
        } catch (error) {
          console.warn('[auth:logout] server logout was not confirmed', error?.message || 'network error');
          alert(lang === 'en'
            ? 'Server-side logout was not confirmed. The session may still be active.'
            : '\u9000\u51fa\u672a\u80fd\u5728\u670d\u52a1\u7aef\u786e\u8ba4\uff0c\u4f1a\u8bdd\u53ef\u80fd\u4ecd\u7136\u6709\u6548\u3002');
        } finally {
          clearLegacyIdentityStorage();
          localStorage.removeItem('userRole');
          roleBindKeyRef.current = '';
          setOpenId('');
          setRole(null);
          setSessionStatus(serverLogoutConfirmed ? 'anonymous' : 'unavailable');
          setAppState('landing');
        }
      }

      return (
        <LanguageContext.Provider value={langContext}>
          <video
            autoPlay loop muted playsInline
            className="fixed inset-0 w-full h-full object-cover -z-20 opacity-60 grayscale"
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260315_073750_51473149-4350-4920-ae24-c8214286f323.mp4"
          />
          <div className="fixed inset-0 bg-blue-950/60 mix-blend-multiply -z-10 pointer-events-none"></div>
          <div className="fixed inset-0 bg-indigo-900/30 mix-blend-color -z-10 pointer-events-none"></div>
          <div className="relative z-10 w-full min-h-screen text-slate-100 font-[500] flex">
            {disputeToken ? <DisputeResolvePage token={disputeToken} /> : (
              <>
                {appState === 'landing' && <HeroLandingPage openId={openId} sessionStatus={sessionStatus} onSessionReady={restoreSession} onLogin={handleLogin} />}
                {appState === 'main' && <MainLayout role={role || 'collector'} openId={openId} initialTab={initialTab} initialEditPoi={initialEditPoi} onLogout={handleLogout} />}
              </>
            )}
          </div>
        </LanguageContext.Provider>
      );
    }

    function DisputeResolvePage({ token }) {
      const { t } = useLang();
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [detail, setDetail] = useState(null);
      const [finalAction, setFinalAction] = useState('approved');
      const [finalOpinion, setFinalOpinion] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [done, setDone] = useState(false);

      useEffect(() => {
        loadDispute();
      }, [token]);

      async function loadDispute() {
        setLoading(true);
        setError('');
        try {
          const data = await fetchJson(`/api/dispute/${encodeURIComponent(token)}?_t=${Date.now()}`);
          setDetail(data.data);
        } catch (err) {
          setError(err.message || t('disputeInvalid'));
        } finally {
          setLoading(false);
        }
      }
      async function submitResult() {
        if (finalAction === 'rejected' && !finalOpinion.trim()) return alert(t('finalOpinion'));
        setSubmitting(true);
        try {
          await fetchJson(`/api/dispute/${encodeURIComponent(token)}/resolve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ finalAction, finalOpinion })
          });
          setDone(true);
        } catch (err) {
          alert(err.message || t('adminActionFailed'));
        } finally {
          setSubmitting(false);
        }
      }
      function loginToUpdatePoi() {
        const poiId = detail?.poiId || poi._id || poi.id || '';
        const url = new URL('/portal.html', window.location.origin);
        url.searchParams.set('tab', 'collect');
        url.searchParams.set('editPoi', poiId);
        url.searchParams.set('role', 'collector');
        window.location.href = url.toString();

      return (
        <div className="w-full h-screen overflow-y-auto mobile-scroll p-4 lg:p-8 flex items-start lg:items-center justify-center pb-24 lg:pb-8">
          <div className="w-full max-w-4xl liquid-glass-strong rounded-[2.5rem] p-5 lg:p-8 animate-silky my-4 lg:my-0">
            <div className="glass-content">
              <div className="flex items-center justify-between gap-4 mb-6">
                <div>
                  <h1 className="text-xl lg:text-2xl text-white tracking-widest uppercase">{t('disputeReviewTitle')}</h1>
                  <p className="text-xs text-rose-100/75 mt-2">{t('thirdPartyReminder')}</p>
                </div>
                <LanguageToggle />
              </div>
              {loading ? (
                <div className="liquid-glass rounded-3xl p-8 text-sm text-white/70">{t('disputeLoading')}</div>
              ) : error ? (
                <div className="liquid-glass rounded-3xl p-8 text-sm text-rose-200">{error || t('disputeInvalid')}</div>
              ) : done ? (
                <div className="liquid-glass-strong rounded-3xl p-8 text-sm text-emerald-200">{t('disputeResolved')}</div>
              ) : (
                <div className="grid lg:grid-cols-[minmax(0,1fr)_320px] gap-4 lg:gap-6">
                  <div className="space-y-4 min-w-0">
                    <div className="liquid-glass rounded-3xl overflow-hidden min-h-[180px]">
                      {poi.imageUrl ? <img src={poi.imageUrl} alt={poi.poiName || poi.name || t('unknownPoi')} className="w-full h-56 object-cover opacity-85 grayscale" /> : <div className="h-56 flex items-center justify-center"><Icon name="image" className="w-10 h-10 text-white/40" /></div>}
                    </div>
                    <div className="liquid-glass p-5 rounded-3xl">
                      <div className="text-xl text-white mb-2">{poi.poiName || poi.name || t('unknownPoi')}</div>
                      <div className="grid sm:grid-cols-2 gap-3 text-xs text-white/70">
                        <div>{t('classification')}: {poi.category || t('pendingCategory')}</div>
                        <div>{t('coordinates')}: {Number(poi.lat ?? poi.location?.lat ?? 0).toFixed(6)}, {Number(poi.lng ?? poi.location?.lng ?? 0).toFixed(6)}</div>
                        <div>{t('collector')}: {detail.collectorOpenId || '-'}</div>
                        <div>{t('reviewer')}: {detail.reviewerOpenId || '-'}</div>
                      </div>
                      <div className="w-full h-px bg-white/10 my-4"></div>
                      <div className="space-y-3 text-sm">
                        <div><div className="text-[10px] text-white/45 uppercase tracking-widest mb-1">{t('originalRejectReason')}</div><div className="text-white/85 whitespace-pre-wrap">{poi.rejectReason || t('noDetail')}</div></div>
                        <div><div className="text-[10px] text-white/45 uppercase tracking-widest mb-1">{t('disputeReason')}</div><div className="text-white/85 whitespace-pre-wrap">{detail.reason || t('noDetail')}</div></div>
                        <div><div className="text-[10px] text-white/45 uppercase tracking-widest mb-1">{t('logData')}</div><div className="text-white/85 whitespace-pre-wrap">{poi.description || t('noLogData')}</div></div>
                      </div>
                      <button onClick={loginToUpdatePoi} className="mt-5 w-full liquid-glass-strong rounded-2xl py-4 text-xs uppercase tracking-widest text-cyan-100 active:scale-95 transition-transform">
                        {t('loginToUpdatePoi')}
                      </button>
                      <div className="mt-2 text-[10px] text-white/45 text-center uppercase tracking-widest">{t('loginToUpdateHint')}</div>
                    </div>
                  </div>
                  <div className="liquid-glass p-5 rounded-3xl h-fit">
                    <div className="text-xs text-white/50 uppercase tracking-widest mb-4">{t('submitFinalResult')}</div>

                      <button onClick={() => setFinalAction('rejected')} className={`${finalAction === 'rejected' ? 'liquid-glass-strong text-rose-200' : 'liquid-glass text-white/65'} rounded-2xl py-3 text-xs uppercase tracking-widest active:scale-95 transition-all`}>{t('finalReject')}</button>

                      {submitting ? t('connecting') : t('submitFinalResult')}
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function HeroLandingPage({ openId, sessionStatus, onSessionReady, onLogin }) {
      const { t } = useLang();
      const qrRef = useRef(null);
      const pollRef = useRef(null);
      const authFlowRef = useRef(0);
      const redirectStartedRef = useRef(false);
      const [statusKey, setStatusKey] = useState(openId ? 'deviceAuthenticated' : 'initializingWechat');
      const [statusText, setStatusText] = useState('');
      const [qrReady, setQrReady] = useState(false);
      const [loggingRole, setLoggingRole] = useState('');
      const isWeChat = useMemo(() => /MicroMessenger/i.test(navigator.userAgent), []);

      const pollStatus = useCallback(async (sid, flowId) => {
        if (authFlowRef.current !== flowId) return;
        try {
          const data = await fetchJson('/auth/status?sid=' + encodeURIComponent(sid) + '&_t=' + Date.now());
          if (authFlowRef.current !== flowId) return;
          if (data.status === 'ok') {
            const restored = await onSessionReady();
            if (authFlowRef.current !== flowId) return;
            if (restored) {
              setStatusKey('authComplete');
              setStatusText('');
            } else {
              setStatusKey('networkWaiting');
              setStatusText('');
            }
            return;
          }
          if (data.status === 'expired') {
            setStatusKey('qrExpired');
            setStatusText('');
            return;
          }
        } catch (_error) {
          if (authFlowRef.current !== flowId) return;
          setStatusKey('networkWaiting');
          setStatusText('');
        }
        if (authFlowRef.current === flowId) {
          pollRef.current = setTimeout(() => pollStatus(sid, flowId), 2000);
        }
      }, [onSessionReady]);

      const initQrLogin = useCallback(async flowId => {
        clearTimeout(pollRef.current);
        setQrReady(false);
        setStatusKey('generatingQr');
        setStatusText('');
        if (qrRef.current) qrRef.current.innerHTML = '';
        try {
          const data = await fetchJson('/auth/wechat/qr?_t=' + Date.now());
          if (authFlowRef.current !== flowId) return;
          if (window.QRCode && qrRef.current) {
            new QRCode(qrRef.current, {
              text: data.qrUrl,
              width: 168,
              height: 168,
              correctLevel: QRCode.CorrectLevel.M
            });
          }
          setQrReady(true);
          setStatusKey('scanToAuth');
          void pollStatus(data.sid, flowId);
        } catch (_error) {
          if (authFlowRef.current !== flowId) return;
          setStatusKey('qrInitFailed');
          setStatusText('');
        }
      }, [pollStatus]);

      useEffect(() => {
        clearTimeout(pollRef.current);
        const flowId = ++authFlowRef.current;
        setStatusText('');

        if (openId || sessionStatus === 'authenticated') {
          setQrReady(false);
          setStatusKey('deviceAuthenticated');
        } else if (sessionStatus === 'loading') {
          setQrReady(false);
          setStatusKey('initializingWechat');
        } else if (sessionStatus === 'unavailable') {
          setQrReady(false);
          setStatusKey('networkWaiting');
        } else if (sessionStatus === 'anonymous') {
          if (isWeChat) {
            if (!redirectStartedRef.current) {
              redirectStartedRef.current = true;
              setStatusKey('redirectingWechat');
              location.href = '/auth/wechat?redirect=' + encodeURIComponent('/portal.html');
            }
          } else {
            void initQrLogin(flowId);
          }
        }

        return () => {
          if (authFlowRef.current === flowId) authFlowRef.current += 1;
          clearTimeout(pollRef.current);
        };
      }, [initQrLogin, isWeChat, openId, sessionStatus]);

      const refreshAuthorization = useCallback(async () => {
        clearTimeout(pollRef.current);
        const flowId = ++authFlowRef.current;
        if (sessionStatus === 'unavailable') {
          setQrReady(false);
          setStatusKey('initializingWechat');
          setStatusText('');
          const restored = await onSessionReady();
          if (authFlowRef.current === flowId && !restored) {
            setStatusKey('networkWaiting');
          }
          return;
        }
        if (sessionStatus === 'anonymous' && !isWeChat) {
          await initQrLogin(flowId);
        }
      }, [initQrLogin, isWeChat, onSessionReady, sessionStatus]);

      async function submitRole(role) {
        setLoggingRole(role);
        try { await onLogin(role); }
        catch (err) { alert(err.message || t('loginFailed')); }
        finally { setLoggingRole(''); }
      }

      return (
        <div className="auth-scroll flex min-h-screen w-full relative p-4 lg:p-6 animate-silky items-center justify-center mobile-scroll">
          <div className="fixed top-5 right-5 z-30"><LanguageToggle /></div>
          <div className="w-full max-w-5xl flex flex-col lg:flex-row gap-4 lg:gap-6 relative z-10">
            <div className="flex-1 liquid-glass-strong rounded-[2.5rem] mobile-card-pad p-10 flex flex-col justify-center items-center text-center">
              <div className="glass-content flex flex-col items-center">
                <div className="w-16 h-16 rounded-full liquid-glass flex items-center justify-center mb-6">
                  <Icon name="globe" className="w-8 h-8 text-blue-200" />
                </div>
                <h1 className="mobile-tight-title text-4xl lg:text-5xl tracking-[-0.05em] text-white leading-[1.2] mb-8 font-[500]">
                  POI <i className="font-serif italic text-blue-200">GeoSync</i> <br/> Platform
                </h1>
                <div className="w-40 h-40 lg:w-48 lg:h-48 liquid-glass rounded-3xl flex items-center justify-center p-4 mb-6 hover:scale-105 transition-transform cursor-pointer">
                  {openId ? (
                    <Icon name="check" className="w-20 h-20 lg:w-24 lg:h-24 text-emerald-300" />
                  ) : (
                    <div className="relative z-10 bg-white p-2 rounded-2xl">
                      <div ref={qrRef} className={qrReady ? '' : 'hidden'}></div>
                      {!qrReady && <Icon name="qr-code" className="w-24 h-24 text-slate-300" />}
                    </div>
                  )}
                </div>
                <p className="text-xs text-blue-100/60 uppercase tracking-widest min-h-[1.25rem]">{statusText || t(statusKey)}</p>
                {!openId && !isWeChat && (
                  <button onClick={refreshAuthorization} disabled={sessionStatus === 'loading'} className="mt-5 liquid-glass px-5 py-3 rounded-full text-xs uppercase tracking-widest text-white disabled:opacity-40 disabled:cursor-not-allowed">
                    {t('refreshQr')}
                  </button>
                )}
              </div>
            </div>

            <div className="flex-1 liquid-glass-strong rounded-[2.5rem] mobile-card-pad p-10 flex flex-col justify-center mb-6 lg:mb-0">
              <div className="glass-content h-full flex flex-col justify-center">
                <h2 className="text-2xl font-[500] text-white mb-2">{t('systemLogin')}</h2>
                <p className="text-sm text-blue-100/50 mb-6 lg:mb-10">{t('selectNode')}</p>
                <div className="flex flex-col gap-4 lg:gap-5">
                  <RoleButton disabled={!openId || loggingRole} loading={loggingRole === 'collector'} icon="camera" title={t('collectorNode')} subtitle={t('collectorSubtitle')} onClick={() => submitRole('collector')} />
                  <RoleButton disabled={!openId || loggingRole} loading={loggingRole === 'verifier'} icon="check-circle" title={t('verifierNode')} subtitle={t('verifierSubtitle')} onClick={() => submitRole('verifier')} />
                </div>
                {!openId && <p className="mt-6 text-[11px] text-blue-100/50 uppercase tracking-widest text-center">{t('authorizeBeforeRole')}</p>}
                <div className="mt-auto pt-8 flex items-center justify-center space-x-4">
                  <div className="h-px w-8 bg-blue-100/20"></div>
                  <span className="text-[10px] tracking-widest uppercase text-blue-100/40">{t('secureConnection')}</span>
                  <div className="h-px w-8 bg-blue-100/20"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function RoleButton({ icon, title, subtitle, onClick, disabled, loading }) {
      return (
        <button onClick={onClick} disabled={disabled} className="liquid-glass p-5 lg:p-6 rounded-2xl flex items-center group active:scale-95 transition-transform cursor-pointer hover:scale-[1.02] disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100">
          <div className="glass-content flex items-center w-full">
            <div className="w-12 h-12 lg:w-14 lg:h-14 rounded-full liquid-glass flex items-center justify-center mr-4 lg:mr-6 text-blue-300 shrink-0">
              <Icon name={loading ? 'loader-2' : icon} className={`w-6 h-6 ${loading ? 'animate-spin' : ''}`} />
            </div>
            <div className="text-left flex-1">
              <div className="font-[500] text-lg text-white">{title}</div>
              <div className="text-xs text-blue-100/50 uppercase tracking-widest mt-1">{subtitle}</div>
            </div>
            <Icon name="arrow-right" className="w-5 h-5 text-white/50 group-hover:text-white transition-colors" />
          </div>
        </button>
      );
    }

    function MainLayout({ role, openId, initialTab, initialEditPoi, onLogout }) {
      const { t } = useLang();
      const [activeTab, setActiveTab] = useState(initialTab || 'home');
      const [pois, setPois] = useState([]);
      const [loadingPois, setLoadingPois] = useState(false);
      const [editingPoi, setEditingPoi] = useState(null);
      const pendingEditRef = useRef(initialEditPoi || '');
      const socketRef = useRef(null);

      useEffect(() => { loadPois(); }, [role, openId]);
      useEffect(() => {
        if (!window.io || !openId) return;
        const socket = io();
        socketRef.current = socket;
        socket.on('newPoi', loadPois);
        socket.on('poiStatusChanged', loadPois);
        return () => socket.disconnect();
      }, [openId, role]);

      async function loadPois() {
        if (!openId) return;
        setLoadingPois(true);
        try {
          const stamp = Date.now();
          const publicUrl = `/api/poi/all?_t=${stamp}`;
          const workUrl = role === 'verifier'
            ? `/api/admin/list?page=1&size=80&_t=${stamp}`
            : `/api/poi/my?page=1&size=80&_t=${stamp}`;
          const [publicData, workData] = await Promise.all([
            fetchJson(publicUrl),
            fetchJson(workUrl)
          ]);
          const publicPois = (publicData.data || []).map(item => normalizePoi(item, 'approved'));
          const workPois = (workData.data || []).map(item => normalizePoi(item, 'pending'));
          const mergedPois = mergePoiLists(publicPois, workPois);
          setPois(mergedPois);
          if (pendingEditRef.current && role === 'collector') {
            const target = mergedPois.find(p => (p.rawId || p.id) === pendingEditRef.current);
            if (target) {
              pendingEditRef.current = '';
              setEditingPoi(target);
              setActiveTab('collect');
            }
          }
        } catch (err) {
          console.warn('[loadPois]', err);
          setPois([]);
        } finally {
          setLoadingPois(false);
        }
      }
      function renderContent() {
        switch(activeTab) {
          case 'home': return <HomeDashboard role={role} pois={pois} setActiveTab={setActiveTab} loading={loadingPois} />;
          case 'collect': return <CollectWorkspace openId={openId} editingPoi={editingPoi} onCancelEdit={() => setEditingPoi(null)} onSubmitted={async ({ editing } = {}) => { await loadPois(); setEditingPoi(null); if (editing) setActiveTab('map'); }} />;
          case 'map': return <MapWorkspace role={role} openId={openId} pois={pois} loading={loadingPois} reloadPois={loadPois} setActiveTab={setActiveTab} onEditPoi={(poi) => { setEditingPoi(poi); setActiveTab('collect'); }} />;
          case 'messages': return <MessageCenter role={role} openId={openId} pois={pois} reloadPois={loadPois} />;
          case 'settings': return <SettingsView role={role} openId={openId} onLogout={onLogout} />;
          default: return null;
        }
      }
      return (
        <div className="flex h-screen w-full overflow-hidden p-4 lg:p-6 pb-0 lg:pb-6 gap-6 relative mobile-app-frame">
          <div className="hidden lg:flex w-24 liquid-glass-strong rounded-3xl flex-col items-center py-8 justify-between z-20">
            <div className="glass-content flex flex-col items-center h-full justify-between">
              <div className="flex flex-col items-center space-y-10">
                <div className="w-12 h-12 liquid-glass rounded-2xl flex items-center justify-center">
                  <Icon name="globe" className="text-blue-200 w-6 h-6" />
                </div>
                <nav className="flex flex-col space-y-6">
                  <SidebarItem icon="home" active={activeTab === 'home'} onClick={() => setActiveTab('home')} title={t('navCore')} />

                  <SidebarItem icon="map" active={activeTab === 'map'} onClick={() => setActiveTab('map')} title={t('navRadar')} />

    function MapWorkspace({ role, openId, pois, loading, reloadPois, setActiveTab, onEditPoi }) {
      const { t, lang } = useLang();
      const [selectedPoi, setSelectedPoi] = useState(null);
      const [query, setQuery] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('');
      const [routeMode, setRouteMode] = useState('walking');
      const [mapMode, setMapMode] = useState('virtual');
      const [virtualView, setVirtualView] = useState({ x: 0, y: 0, scale: 1 });
      const [currentLocation, setCurrentLocation] = useState(null);
      const [locationLoading, setLocationLoading] = useState(false);
      const [locationError, setLocationError] = useState('');
      const dragRef = useRef(null);
      const displayPois = pois.filter(p => {
        const roleHit = role === 'verifier' ? p.status !== 'recollect' : true;
        const queryHit = !query.trim() || `${p.name}${p.category}${p.address}`.toLowerCase().includes(query.trim().toLowerCase());
        const categoryHit = !categoryFilter || p.category === categoryFilter;
        return roleHit && queryHit && categoryHit;
      });
      const pins = useMemo(() => makePins(displayPois), [displayPois]);

      async function handleVerify(poi, isApproved) {
        let rejectReason = '';
        if (!isApproved) {
          rejectReason = prompt(t('rejectPrompt'));
          if (rejectReason === null) return;
          if (!rejectReason.trim()) return alert(t('rejectReasonRequired'));
        }
        try {
          await fetchJson('/api/admin/approve-poi', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: poi.rawId || poi.id, action: isApproved ? 'approved' : 'rejected', rejectReason })
          });
          setSelectedPoi(null);
          reloadPois();
        } catch (err) { alert(err.message || t('verificationFailed')); }
      }
      function handleCollectorAction(poi, action) {
        if (action === 'recollect') { setSelectedPoi(null); setActiveTab('collect'); return; }
        if (action === 'update') { setSelectedPoi(null); onEditPoi(poi); return; }
        if (action === 'reject') { setActiveTab('messages'); }
      }
      async function handleDispute(poi) {
        const reason = prompt(t('disputePrompt'));
        if (reason === null) return;
        if (!reason.trim()) return alert(t('disputeReasonRequired'));
        try {
          await fetchJson('/api/poi/dispute', {
            method: 'POST',

      async function handleLocate() {
        setLocationLoading(true);

      function updateVirtualZoom(delta) {
        setVirtualView(view => ({ ...view, scale: Math.max(0.65, Math.min(2.6, view.scale + delta)) }));

      function resetVirtualView() {
        setVirtualView({ x: 0, y: 0, scale: 1 });

      function handleVirtualPointerDown(e) {
        if (mapMode !== 'virtual') return;
        if (e.target.closest?.('[data-map-control="true"], button, input, textarea, select, a')) return;
        e.currentTarget.setPointerCapture?.(e.pointerId);
        dragRef.current = {
          pointerId: e.pointerId,
          startX: e.clientX,
          startY: e.clientY,
          originX: virtualView.x,
          originY: virtualView.y
        };
      }
      function handleVirtualPointerMove(e) {
        const drag = dragRef.current;
        if (!drag || drag.pointerId !== e.pointerId) return;
        const nextX = drag.originX + e.clientX - drag.startX;
        const nextY = drag.originY + e.clientY - drag.startY;
        setVirtualView(view => ({ ...view, x: nextX, y: nextY }));
      }
      function handleVirtualPointerEnd(e) {
        if (dragRef.current?.pointerId === e.pointerId) dragRef.current = null;
      }

    function AmapLayer({ pois, selectedPoi, setSelectedPoi, currentLocation }) {
      const { t } = useLang();
      const mapRef = useRef(null);
      const instanceRef = useRef(null);
      const markersRef = useRef([]);
      const currentMarkerRef = useRef(null);
      const [status, setStatus] = useState('loading');

      useEffect(() => {
        let cancelled = false;
        loadAmapSdk()
          .then(AMap => {
            if (cancelled || !mapRef.current || instanceRef.current) return;
            const valid = pois.filter(p => isValidCoordinate(p.lat, p.lng));
            const center = valid[0] ? [valid[0].lng, valid[0].lat] : [116.397428, 39.90923];
            instanceRef.current = new AMap.Map(mapRef.current, {
              zoom: valid.length ? 14 : 4,
              center,
              resizeEnable: true,
              viewMode: '2D',
              mapStyle: 'amap://styles/darkblue'
            });
            setStatus('ready');
          })
          .catch(err => {
            console.warn('[amap]', err);
            setStatus(err.message === 'AMap key missing' ? 'missing-key' : 'error');
          });
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        const AMap = window.AMap;
        const map = instanceRef.current;
        if (!AMap || !map) return;
        markersRef.current.forEach(marker => marker.setMap(null));
        markersRef.current = spreadGeoPois(pois.filter(p => isValidCoordinate(p.lat, p.lng))).map(({ poi, lat, lng }) => {
          const colors = getPoiColors(poi.status);
          const marker = new AMap.Marker({
            position: [lng, lat],
            title: poi.name || t('unknownPoi'),
            content: `<div style="width:18px;height:18px;border-radius:999px;background:${amapStatusColor(colors.text)};border:3px solid #0f172a;box-shadow:0 0 18px ${amapStatusColor(colors.text)};"></div>`,
            offset: new AMap.Pixel(-9, -9)
          });
          marker.on('click', () => setSelectedPoi(poi));
          marker.setMap(map);
          return marker;
        });
        if (markersRef.current.length) map.setFitView(markersRef.current, false, [70, 70, 70, 70], 16);
      }, [pois, setSelectedPoi, status, t]);

      useEffect(() => {
        const map = instanceRef.current;
        if (!window.AMap || !map || !selectedPoi || !isValidCoordinate(selectedPoi.lat, selectedPoi.lng)) return;
        map.setZoomAndCenter(Math.max(map.getZoom(), 15), [selectedPoi.lng, selectedPoi.lat], false, 300);
      }, [selectedPoi, status]);

      useEffect(() => {
        const AMap = window.AMap;
        const map = instanceRef.current;
        if (!AMap || !map) return;
        if (currentMarkerRef.current) currentMarkerRef.current.setMap(null);
        currentMarkerRef.current = null;
        if (currentLocation && isValidCoordinate(currentLocation.lat, currentLocation.lng)) {
          currentMarkerRef.current = new AMap.Marker({
            position: [currentLocation.lng, currentLocation.lat],
            content: '<div style="width:20px;height:20px;border-radius:999px;background:rgba(125,211,252,.28);border:2px solid #bae6fd;box-shadow:0 0 24px rgba(125,211,252,.9);"></div>',
            offset: new AMap.Pixel(-10, -10)
          });
          currentMarkerRef.current.setMap(map);
        }
      }, [currentLocation, status]);

      return (
        <div className="absolute inset-0 bg-slate-950">
          <div ref={mapRef} className="absolute inset-0" />
          {status !== 'ready' && (
            <div className="absolute inset-0 flex items-center justify-center bg-slate-950/70 backdrop-blur-sm">
              <div className="liquid-glass rounded-3xl px-6 py-4 text-sm text-white/75 flex items-center">
                {status === 'loading' && <Icon name="loader-2" className="w-4 h-4 mr-3 animate-spin" />}
                {status === 'loading' ? t('mapLoading') : status === 'missing-key' ? t('amapKeyMissing') : t('mapLoadFailed')}
              </div>
            </div>
          )}
        </div>
      );

    function amapStatusColor(textClass) {
      if (textClass.includes('emerald')) return '#34d399';
      if (textClass.includes('rose')) return '#fb7185';
      if (textClass.includes('amber')) return '#fbbf24';
      if (textClass.includes('blue')) return '#60a5fa';
      return '#22d3ee';
    }

    function spreadGeoPois(pois) {
      const groups = new Map();
      pois.forEach(poi => {
        const key = `${poi.lat.toFixed(5)},${poi.lng.toFixed(5)}`;
        const group = groups.get(key) || [];
        group.push(poi);
        groups.set(key, group);
      });
      const result = [];
      groups.forEach(group => {
        if (group.length === 1) {
          result.push({ poi: group[0], lat: group[0].lat, lng: group[0].lng });
          return;
        }
        const radius = 0.000035 * Math.min(group.length, 8);
        group.forEach((poi, index) => {
          const angle = (Math.PI * 2 * index) / group.length;
          result.push({
            poi,
            lat: poi.lat + Math.sin(angle) * radius,
            lng: poi.lng + Math.cos(angle) * radius
          });
        });
      });
      return result;
    }

    function makePins(pois) {
      if (!pois.length) return [];
      const valid = pois.filter(p => isValidCoordinate(p.lat, p.lng));
      if (!valid.length) return [];
      const minLat = Math.min(...valid.map(p => p.lat));
      const maxLat = Math.max(...valid.map(p => p.lat));
      const minLng = Math.min(...valid.map(p => p.lng));
      const maxLng = Math.max(...valid.map(p => p.lng));
      const basePins = valid.map((poi, index) => ({
        poi,
        left: maxLng === minLng ? 50 : 15 + ((poi.lng - minLng) / (maxLng - minLng)) * 70,
        top: maxLat === minLat ? 50 : 85 - ((poi.lat - minLat) / (maxLat - minLat)) * 70,
        index
      }));
      const buckets = new Map();
      basePins.forEach(pin => {
        const key = `${Math.round(pin.left / 3)},${Math.round(pin.top / 3)}`;
        const bucket = buckets.get(key) || [];
        bucket.push(pin);
        buckets.set(key, bucket);
      });
      buckets.forEach(bucket => {
        if (bucket.length <= 1) return;
        const radius = Math.min(10, 3.6 + bucket.length * 0.8);
        bucket.forEach((pin, index) => {
          const angle = (Math.PI * 2 * index) / bucket.length;
          pin.left += Math.cos(angle) * radius;
          pin.top += Math.sin(angle) * radius;
        });
      });
      return basePins.map(pin => ({
        poi: pin.poi,
        left: Math.max(8, Math.min(92, pin.left)),
        top: Math.max(8, Math.min(92, pin.top))
      }));
    }

    function MessageCenter({ role, openId, pois = [], reloadPois }) {
      const { t } = useLang();

      const [socketReady, setSocketReady] = useState(false);

        { id: 'tasks', type: 'system_verify', title: t('taskReminder'), content: role === 'verifier' ? t('verifierTaskContent', { count: pendingPois.length }) : t('collectorTaskContent', { count: pendingPois.length }), time: t('online'), unread: role === 'verifier' && pendingPois.length > 0 },
        { id: 'private', type: 'private', title: t('privateChat'), content: chatRooms[0]?.lastMessage || t('privateChatContent', { count: chatRooms.length }), time: chatRooms[0]?.time || t('online'), unread: false },
        { id: 'group', type: 'group', title: role === 'verifier' ? t('reviewerGroupChat') : t('collectorGroupChat'), content: groupLogs.at(-1)?.text || t('groupFallback'), time: groupLogs.at(-1)?.time || t('online'), unread: false }
      ], [unreadCount, notifications, role, pendingPois.length, chatRooms, groupLogs, t]);

      useEffect(() => { loadNotifications(); loadChatRooms(); loadChatHistory(groupRoomId); }, [openId, groupRoomId]);
      useEffect(() => {
        if (!window.io || !openId) return;
        const socket = io();
        socketRef.current = socket;
        socket.on('connect', () => { setSocketReady(true); socket.emit('setNickname', { nickname: `${role === 'verifier' ? 'Verifier' : 'Collector'}-${openId.slice(-4)}` }); });

        socket.on('chatMessage', msg => setChatLogs(prev => ({ ...prev, [msg.roomId]: [...(prev[msg.roomId] || []), msg] })));
        socket.on('chatRoomUpdated', room => {
          setChatRooms(prev => [room, ...prev.filter(item => item.roomId !== room.roomId)]);
          socket.emit('joinChatRoom', { roomId: room.roomId });
        });
        socket.on('notification', msg => { setNotifications(prev => [msg, ...prev.filter(item => item.id !== msg.id)]); setUnreadCount(c => c + (msg.read ? 0 : 1)); });
        socket.on('announcement', () => loadNotifications());
        return () => socket.disconnect();
      }, [openId, role]);

      async function loadNotifications() {
        if (!openId) return;
        try {
          const data = await fetchJson(`/api/notifications?page=1&size=80&_t=${Date.now()}`);
          setNotifications(data.data || []);
          setUnreadCount(data.unreadCount || 0);
        } catch (err) { console.warn('[notifications]', err); }
      }
      async function loadChatRooms() {
        if (!openId) return;
        try {
          const data = await fetchJson(`/api/chat/rooms?_t=${Date.now()}`);
          setChatRooms(data.data || []);
        } catch (err) { console.warn('[rooms]', err); }
      }
      async function loadChatHistory(roomId) {
        try {
          const data = await fetchJson(`/api/chat/history?roomId=${encodeURIComponent(roomId)}&size=100&_t=${Date.now()}`);
          setChatLogs(prev => ({ ...prev, [roomId]: data.data || [] }));
        } catch (err) { console.warn('[history]', err); }
      }
      async function markRead() {
        try {
          await fetchJson('/api/notifications/read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
          setNotifications(prev => prev.map(item => ({ ...item, read: true })));
          setUnreadCount(0);
        } catch (_err) {}
      }
      function selectItem(item) {
        setActiveChat(item);
        if (item.id !== 'private') setSelectedRoomId('');
        if (item.id === 'notifications' && unreadCount) markRead();
        if (item.id === 'group') loadChatHistory(groupRoomId);
        if (item.id === 'private') loadChatRooms();
      }
      function openPrivateRoom(room) {
        setSelectedRoomId(room.roomId);
        loadChatHistory(room.roomId);
        socketRef.current?.emit('joinChatRoom', { roomId: room.roomId });
      }
      function closePrivateRoom() {
        setSelectedRoomId('');
      }
      function activeRoomId() {
        if (!activeChat) return null;
        if (activeChat.id === 'group') return groupRoomId;
        if (activeChat.id === 'private') return selectedRoomId || null;
        return null;
      }
      function sendMessage() {
        const roomId = activeRoomId();
        if (!roomId) return;
        const text = (input[roomId] || '').trim();
        if (!text || !socketRef.current) return;
        socketRef.current.emit('chatMessage', { text, roomId });
        setInput(prev => ({ ...prev, [roomId]: '' }));

                  <div className="flex items-center min-w-0">
                    <button onClick={() => selectedRoomId ? closePrivateRoom() : setActiveChat(null)} className="p-2 -ml-2 mr-2 text-white/60 hover:text-white lg:hidden"><Icon name="chevron-left" className="w-5 h-5" /></button>
                    <div className="flex items-center space-x-4"><div className="w-10 h-10 rounded-full liquid-glass flex items-center justify-center text-white">{getMsgIcon(activeChat.type)}</div><div><h3 className="text-sm font-[500] text-white tracking-wide">{selectedRoom ? (selectedRoom.poiName || t('unknownPoi')) : activeChat.title}</h3><p className="text-[10px] text-white/50 uppercase tracking-widest mt-0.5">{selectedRoom ? `${role === 'verifier' ? t('collector') : t('reviewer')}: ${role === 'verifier' ? (selectedRoom.collectorName || selectedRoom.collectorOpenId || '') : (selectedRoom.reviewerName || selectedRoom.reviewerOpenId || '')}` : (activeChat.type.includes('system') ? t('encrypted') : t('online'))}</p></div></div>
                  </div>
                </div>
                <div className="flex-1 min-h-0 overflow-y-auto p-4 lg:p-6 flex flex-col hide-scrollbar pb-[120px] lg:pb-6 gap-3">
                  {activeChat.id === 'notifications' ? (
                    notifications.length ? notifications.map(n => <NoticeCard key={n.id} item={n} />) : <EmptyComms content={t('noNotifications')} type={activeChat.type} />

                      <div className="space-y-3">

                                <div className="text-sm text-white font-[500] truncate">{room.poiName || t('unknownPoi')}</div>
                                <div className="text-[10px] text-white/50 uppercase tracking-widest mt-1 truncate">
                                  {role === 'verifier'
                                    ? `${t('collector')}: ${room.collectorName || room.collectorOpenId || ''}`
                                    : `${t('reviewer')}: ${room.reviewerName || room.reviewerOpenId || ''}`}

                                <div className="text-xs text-white/65 mt-3 truncate">{room.lastMessage || t('noChatHistory')}</div>

                  ) : roomId ? (
                    <>
                      {activeChat.id === 'private' && selectedRoomId && (
                        <button onClick={closePrivateRoom} className="self-start liquid-glass px-4 py-2 rounded-full text-[10px] uppercase tracking-widest text-white/70 hover:text-white">
                          <Icon name="chevron-left" className="w-3 h-3 inline-block mr-1" /> {t('backToRooms')}
                        </button>
                      )}
                      {logs.length ? logs.map((msg, idx) => <ChatBubble key={idx} msg={msg} self={msg.openId === openId || msg.fromOpenId === openId} />) : <EmptyComms content={activeChat.id === 'private' ? t('noChatHistory') : activeChat.content} type={activeChat.type} />}

            )}
          </div>
        </div>
      );

    function SettingsView({ role, openId, onLogout }) {
      const { t } = useLang();
      const [adminLoginOpen, setAdminLoginOpen] = useState(false);
      const [adminPanelOpen, setAdminPanelOpen] = useState(false);
      const [adminForm, setAdminForm] = useState({ username: '', password: '' });
      const [adminAuthenticated, setAdminAuthenticated] = useState(false);
      const [adminSessionStatus, setAdminSessionStatus] = useState('loading');
      const adminProbeRef = useRef(0);

      const clearAdminUi = useCallback((nextStatus = 'anonymous') => {
        adminProbeRef.current += 1;
        setAdminAuthenticated(false);
        setAdminSessionStatus(nextStatus);
        setAdminPanelOpen(false);
      }, []);

      const probeAdminSession = useCallback(async () => {
        const generation = ++adminProbeRef.current;
        try {
          const response = await fetch('/api/admin/session', {
            cache: 'no-store',
            credentials: 'same-origin',
            headers: { Accept: 'application/json' }
          });
          if (generation !== adminProbeRef.current) return false;
          if (response.ok) {
            setAdminAuthenticated(true);
            setAdminSessionStatus('authenticated');
            return true;
          }
          if (response.status === 401 || response.status === 403) {
            clearAdminUi('anonymous');
            return false;
          }
        } catch (_error) {
          if (generation !== adminProbeRef.current) return false;
          setAdminSessionStatus('unavailable');
          return false;
        }
        if (generation !== adminProbeRef.current) return false;
        setAdminSessionStatus('unavailable');
        return false;
      }, [clearAdminUi]);

      useEffect(() => {
        sessionStorage.removeItem('adminToken');
        void probeAdminSession();
        const onFocus = () => { void probeAdminSession(); };
        const onVisibility = () => {
          if (document.visibilityState === 'visible') void probeAdminSession();
        };
        window.addEventListener('focus', onFocus);
        document.addEventListener('visibilitychange', onVisibility);
        return () => {
          window.removeEventListener('focus', onFocus);
          document.removeEventListener('visibilitychange', onVisibility);
        };
      }, [probeAdminSession]);

      async function loginAdmin() {
        if (!adminForm.username.trim() || !adminForm.password) return alert(t('adminEmpty'));
        try {
          await fetchJson('/api/admin/login', {
            method: 'POST',
            cache: 'no-store',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(adminForm)
          });
          adminProbeRef.current += 1;
          sessionStorage.removeItem('adminToken');
          setAdminAuthenticated(true);
          setAdminSessionStatus('authenticated');
          setAdminLoginOpen(false);
          setAdminPanelOpen(true);
          setAdminForm({ username: '', password: '' });
        } catch (err) { alert(err.message || t('adminLoginFailed')); }
      }

      async function logoutAdmin() {
        adminProbeRef.current += 1;
        try {
          await fetchJson('/api/admin/logout', {
            method: 'POST',
            cache: 'no-store',
            credentials: 'same-origin',
            headers: { Accept: 'application/json' }
          });
          sessionStorage.removeItem('adminToken');
          clearAdminUi('anonymous');
          return true;
        } catch (err) {
          alert(err.message || t('adminLogoutFailed'));
          return false;
        }
      }

      if (adminPanelOpen && adminAuthenticated) {
        return <AdminPanel
          onBack={() => setAdminPanelOpen(false)}
          onLogout={logoutAdmin}
          onUnauthorized={clearAdminUi}
        />;
      }

      return (
        <div className="flex-1 flex flex-col p-6 lg:p-12 overflow-y-auto w-full items-center liquid-glass-strong mobile-shell-flat rounded-[2.5rem] hide-scrollbar pb-[100px] lg:pb-12 mobile-panel-height relative mobile-settings-shell">
          <div className="glass-content w-full max-w-md lg:max-w-xl animate-silky mt-4">
            <div className="flex items-center justify-between gap-3 mb-10">
              <h2 className="text-xl font-[500] text-white tracking-widest uppercase">{t('settingsTitle')}</h2>
              <LanguageToggle />
            </div>
            <div className="mb-4 px-2 text-[10px] font-[500] text-white/60 uppercase tracking-widest">{t('interface')}</div>
            <div className="space-y-3 mb-10">
              <SettingRow icon="volume-2" title={t('environmentAudio')} subtitle={t('audioLevel')} toggle />
              <SettingRow icon="moon" title={t('visualMode')} subtitle={t('glassMode')} />
            </div>
            <div className="mb-4 px-2 text-[10px] font-[500] text-white/60 uppercase tracking-widest">{t('system')}</div>
            <div className="space-y-3 mb-10">
              <SettingRow icon="user" title={t('identity')} subtitle={`${role === 'verifier' ? t('reviewer') : t('collector')} - ${openId ? openId.slice(0, 8) + '...' : t('noId')}`} />
              <SettingRow icon="smartphone" title={t('hardwareLink')} subtitle={t('hardwareSynced')} />
              <SettingRow
                icon="shield"
                title={t('adminEntry')}
                subtitle={adminSessionStatus === 'unavailable'
                  ? t('adminSessionUnavailable')
                  : adminAuthenticated ? t('adminLoggedIn') : t('adminEntryHint')}
                onClick={() => {
                  if (adminAuthenticated) setAdminPanelOpen(true);
                  else if (adminSessionStatus === 'anonymous') setAdminLoginOpen(true);
                  else void probeAdminSession();
                }}
              />
            </div>
            <button onClick={onLogout} className="w-full liquid-glass text-white py-4 rounded-2xl text-xs font-[500] hover:scale-[1.02] active:scale-95 transition-transform uppercase tracking-widest mt-4">{t('disconnectNode')}</button>
          </div>
          {adminLoginOpen && (
            <div className="absolute inset-0 bg-black/50 backdrop-blur-md z-50 flex items-center justify-center p-5">
              <div className="liquid-glass-strong rounded-3xl p-6 w-full max-w-sm">
                <div className="glass-content space-y-4">
                  <h3 className="text-lg text-white uppercase tracking-widest">{t('adminAuth')}</h3>
                  <input value={adminForm.username} onChange={e => setAdminForm({ ...adminForm, username: e.target.value })} placeholder={t('adminUsername')} className="w-full liquid-glass rounded-2xl px-4 py-3 text-white placeholder:text-white/30 outline-none" />
                  <input type="password" value={adminForm.password} onChange={e => setAdminForm({ ...adminForm, password: e.target.value })} placeholder={t('adminPassword')} className="w-full liquid-glass rounded-2xl px-4 py-3 text-white placeholder:text-white/30 outline-none" />

              </div>
            </div>

        </div>

    function AdminPanel({ onBack, onLogout, onUnauthorized }) {
      const { t } = useLang();
      const [pois, setPois] = useState([]);
      const [thirdPartyEmail, setThirdPartyEmail] = useState('');
      const [broadcast, setBroadcast] = useState({ audience: 'all', title: '', content: '' });
      const [collectionPaused, setCollectionPaused] = useState(false);
      const [loading, setLoading] = useState(false);
      const [broadcasting, setBroadcasting] = useState(false);
      const cookieRequest = { cache: 'no-store', credentials: 'same-origin' };

      async function adminFetch(url, options = cookieRequest) {
        try {
          return await fetchJson(url, options);
        } catch (error) {
          if (error?.status === 401 || error?.status === 403) {
            setPois([]);
            setThirdPartyEmail('');
            setCollectionPaused(false);
            onUnauthorized();
          }
          throw error;
        }
      }

      useEffect(() => { loadAdminData(); }, []);

      async function loadAdminData() {
        setLoading(true);
        try {
          const [poiData, statusData, disputeData] = await Promise.all([
            adminFetch(`/api/admin/reviewed-pois?_t=${Date.now()}`, cookieRequest),
            adminFetch(`/api/admin/collection-status?_t=${Date.now()}`, cookieRequest),
            adminFetch(`/api/admin/dispute-settings?_t=${Date.now()}`, cookieRequest)
          ]);
          setPois(poiData.data || []);
          setCollectionPaused(Boolean(statusData.collectionPaused));
          setThirdPartyEmail(disputeData.thirdPartyEmail || '');
        } catch (err) { alert(err.message || t('adminLoadFailed')); }
        finally { setLoading(false); }
      }
      async function toggleCollection() {
        try {
          const data = await adminFetch('/api/admin/collection-status', {
            ...cookieRequest,
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ collectionPaused: !collectionPaused })
          });
          setCollectionPaused(Boolean(data.collectionPaused));
        } catch (err) { alert(err.message || t('adminActionFailed')); }
      }
      async function deletePoi(poi) {
        if (!confirm(t('confirmDeletePoi'))) return;
        try {
          await adminFetch(`/api/admin/poi/${encodeURIComponent(poi.id || poi._id)}`, {
            ...cookieRequest,
            method: 'DELETE'
          });
          setPois(prev => prev.filter(item => (item.id || item._id) !== (poi.id || poi._id)));
        } catch (err) { alert(err.message || t('adminActionFailed')); }
      }
      async function emailPoi(poi) {
        try {
          const data = await adminFetch('/api/admin/email-poi', {
            ...cookieRequest,
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: poi.id || poi._id })
          });
          alert(t('emailSentTo', { email: data.email || thirdPartyEmail }));
        } catch (err) { alert(err.message || t('emailSendFailed')); }
      }
      async function sendBroadcast() {
        const content = broadcast.content.trim();
        if (!content) return alert(t('broadcastEmpty'));
        setBroadcasting(true);
        try {
          const data = await adminFetch('/api/admin/broadcast', {
            ...cookieRequest,
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              audience: broadcast.audience,
              title: broadcast.title.trim() || t('broadcastTitlePlaceholder'),
              content
            })
          });
          setBroadcast(prev => ({ ...prev, content: '' }));
          alert(t('broadcastSent', { count: data.count ?? 0 }));
        } catch (err) { alert(err.message || t('broadcastFailed')); }
        finally { setBroadcasting(false); }
      }
      async function saveDisputeSettings() {
        try {
          const data = await adminFetch('/api/admin/dispute-settings', {
            ...cookieRequest,
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ thirdPartyEmail })
          });
          setThirdPartyEmail(data.thirdPartyEmail || thirdPartyEmail);
          alert(t('thirdPartyEmailSaved'));
        } catch (err) { alert(err.message || t('adminActionFailed')); }
      }

      return (
        <div className="flex-1 w-full h-full mobile-panel-height overflow-y-auto lg:overflow-hidden hide-scrollbar pb-[110px] lg:pb-0">
          <div className="w-full max-w-6xl mx-auto h-full flex flex-col p-4 lg:p-6 animate-silky">
            <div className="liquid-glass-strong rounded-3xl px-4 lg:px-6 py-4 mb-4 shrink-0">
              <div className="glass-content flex items-center justify-between gap-4">
                <button onClick={onBack} className="w-10 h-10 liquid-glass rounded-2xl flex items-center justify-center text-white hover:scale-105 active:scale-95 transition-transform"><Icon name="chevron-left" className="w-5 h-5" /></button>
                <div className="min-w-0 text-center">
                  <h2 className="text-base lg:text-xl text-white uppercase tracking-widest truncate">{t('adminPanel')}</h2>
                  <p className="text-[10px] text-white/45 uppercase tracking-widest mt-1">{t('reviewedPois')} - {pois.length}</p>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  <button onClick={loadAdminData} className="w-10 h-10 liquid-glass rounded-2xl flex items-center justify-center text-white hover:scale-105 active:scale-95 transition-transform" title={t('reload')}><Icon name={loading ? 'loader-2' : 'refresh-cw'} className={`w-4 h-4 ${loading ? 'animate-spin' : ''}`} /></button>
                  <button onClick={onLogout} className="w-10 h-10 liquid-glass rounded-2xl flex items-center justify-center text-rose-100 hover:scale-105 active:scale-95 transition-transform" title={t('adminLogout')}><Icon name="log-out" className="w-4 h-4" /></button>
                </div>
              </div>
            </div>
            <div className="grid lg:grid-cols-[300px_minmax(0,1fr)] gap-4 lg:gap-5 min-h-0 flex-1">
              <div className="space-y-4 lg:overflow-y-auto hide-scrollbar">
                <div className="liquid-glass p-5 rounded-2xl">
                  <div className="glass-content">
                    <div className="text-xs text-white/50 uppercase tracking-widest mb-3">{t('collectionSwitch')}</div>
                    <button onClick={toggleCollection} className={`w-full py-4 rounded-2xl text-xs uppercase tracking-widest ${collectionPaused ? 'liquid-glass-strong text-rose-200' : 'liquid-glass text-emerald-200'}`}>
                      {collectionPaused ? t('resumeCollection') : t('pauseCollection')}
                    </button>
                    <p className="text-xs text-white/55 mt-3 leading-relaxed">{collectionPaused ? t('collectionPaused') : t('collectionOpen')}</p>
                  </div>
                </div>
                <div className="liquid-glass p-5 rounded-2xl">
                  <div className="glass-content space-y-3">
                    <label className="block text-xs text-white/50 uppercase tracking-widest">{t('thirdPartyEmail')}</label>
                    <input value={thirdPartyEmail} onChange={e => setThirdPartyEmail(e.target.value)} placeholder={t('thirdPartyEmailPlaceholder')} className="w-full liquid-glass rounded-2xl px-4 py-3 text-white placeholder:text-white/30 outline-none text-sm" />
                    <button onClick={saveDisputeSettings} className="w-full liquid-glass-strong rounded-2xl py-3 text-[10px] uppercase tracking-widest text-white active:scale-95 transition-transform">{t('save')}</button>
                  </div>
                </div>
                <div className="liquid-glass p-5 rounded-2xl">
                  <div className="glass-content space-y-3">
                    <div className="text-xs text-white/50 uppercase tracking-widest">{t('broadcastPanel')}</div>
                    <input value={broadcast.title} onChange={e => setBroadcast(prev => ({ ...prev, title: e.target.value }))} placeholder={t('broadcastTitlePlaceholder')} className="w-full liquid-glass rounded-2xl px-4 py-3 text-white placeholder:text-white/30 outline-none text-sm" />
                    <select value={broadcast.audience} onChange={e => setBroadcast(prev => ({ ...prev, audience: e.target.value }))} className="w-full liquid-glass rounded-2xl px-4 py-3 text-white outline-none text-sm">
                      <option className="bg-slate-950" value="all">{t('audienceAll')}</option>
                      <option className="bg-slate-950" value="collector">{t('audienceCollector')}</option>
                      <option className="bg-slate-950" value="reviewer">{t('audienceReviewer')}</option>
                    </select>
                    <textarea value={broadcast.content} onChange={e => setBroadcast(prev => ({ ...prev, content: e.target.value }))} rows="4" maxLength="500" placeholder={t('broadcastContentPlaceholder')} className="w-full liquid-glass rounded-2xl px-4 py-3 text-white placeholder:text-white/30 outline-none text-sm resize-none" />
                    <button onClick={sendBroadcast} disabled={broadcasting} className="w-full liquid-glass-strong rounded-2xl py-3 text-[10px] uppercase tracking-widest text-white disabled:opacity-50 active:scale-95 transition-transform">
                      {broadcasting ? t('connecting') : t('send')}
                    </button>
                  </div>
                </div>
              </div>
              <div className="liquid-glass-strong rounded-3xl p-4 lg:p-5 min-h-[360px] lg:min-h-0 flex flex-col overflow-hidden">
                <div className="glass-content flex flex-col min-h-0 h-full">
                  <div className="flex items-center justify-between gap-3 px-1 pb-4 shrink-0">
                    <div className="text-[10px] text-white/50 uppercase tracking-widest">{t('reviewedPois')}</div>
                    <div className="liquid-glass rounded-full px-3 py-1 text-[10px] text-white/60 font-mono">{pois.length}</div>
                  </div>
                  <div className="flex-1 min-h-0 overflow-y-auto space-y-3 hide-scrollbar lg:pr-1">
                    {pois.length ? pois.map(poi => (
                      <div key={poi.id || poi._id} className="liquid-glass p-4 rounded-2xl">
                        <div className="glass-content grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_auto] md:items-center gap-4">
                          <div className="min-w-0">
                            <div className="flex items-center gap-3 mb-2 min-w-0">
                              <div className="text-sm text-white font-[500] truncate">{poi.poiName || poi.name || t('unknownPoi')}</div>
                              <StatusBadge status={poi.status} />
                            </div>
                            <div className="text-[10px] text-white/50 font-mono truncate">[{Number((poi.lat ?? poi.location?.lat) || 0).toFixed(6)}, {Number((poi.lng ?? poi.location?.lng) || 0).toFixed(6)}]</div>
                            {poi.rejectReason && <div className="text-xs text-rose-200/80 mt-2 truncate">{poi.rejectReason}</div>}
                          </div>
                          <div className="grid grid-cols-2 gap-2 md:w-48 shrink-0">
                            <button onClick={() => emailPoi(poi)} className="liquid-glass rounded-2xl py-3 text-[10px] uppercase tracking-widest text-cyan-100 hover:scale-[1.02] active:scale-95 transition-transform">{t('emailPoi')}</button>
                            <button onClick={() => deletePoi(poi)} className="liquid-glass rounded-2xl py-3 text-[10px] uppercase tracking-widest text-rose-200 hover:scale-[1.02] active:scale-95 transition-transform">{t('deletePoi')}</button>
                          </div>
                        </div>
                      </div>
                    )) : <EmptyComms content={t('noReviewedPois')} type="system" />}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function SettingRow({ icon, title, subtitle, toggle, onClick }) {
      return (
        <div onClick={onClick} className="liquid-glass p-5 rounded-2xl flex items-center cursor-pointer hover:scale-[1.02] active:scale-95 transition-transform group">
          <div className="glass-content flex items-center w-full">
            <div className="w-10 h-10 rounded-xl liquid-glass flex items-center justify-center mr-4 shrink-0 text-white group-hover:scale-105 transition-transform"><Icon name={icon} className="w-4 h-4" /></div>
            <div className="flex-1 min-w-0"><div className="font-[500] text-white text-sm truncate">{title}</div>{subtitle && <div className="text-[10px] text-white/60 uppercase tracking-widest mt-1 font-mono truncate">{subtitle}</div>}</div>
            {toggle ? <div className="w-10 h-5 liquid-glass rounded-full p-1 flex justify-end shrink-0 ml-4"><div className="w-3 h-3 bg-white rounded-full shadow-sm"></div></div> : <Icon name="chevron-right" className="w-4 h-4 text-white/40 group-hover:translate-x-1 transition-transform group-hover:text-white shrink-0 ml-4" />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
